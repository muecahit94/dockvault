services:
  dockvault:
    image: ghcr.io/muecahit94/dockvault:latest
    build: .
    container_name: dockvault
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - TZ=Europe/Berlin
      - DOCKVAULT_PORT=8080
      - DOCKVAULT_DATA_DIR=/app/data
      - DOCKVAULT_BACKUP_DIR=/app/backups
      - DOCKVAULT_HELPER_IMAGE=alpine:3.21
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./data:/app/data
      - ./backups:/app/backups
