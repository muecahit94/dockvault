name: Sync README to Docker Hub

on:
  push:
    branches:
      - main
    paths:
      - README.dockerhub.md
      - .github/workflows/dockerhub-readme.yml
  workflow_dispatch:

jobs:
  sync-readme:
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - name: Checkout Docker Hub README
        if: ${{ env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != '' }}
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            README.dockerhub.md

      - name: Update Docker Hub Description
        if: ${{ env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != '' }}
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: muecahit/dockvault
          readme-filepath: ./README.dockerhub.md
          short-description: Self-hosted Docker volume & Compose backup UI with AES-256 encryption, S3/Azure sync & restore.
          enable-url-completion: true
